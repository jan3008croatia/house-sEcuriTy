<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="../styles.css">
    <script src="../js/app.js" defer></script>
    <script src="../js/camera.js" defer></script>
    <script src="../js/videoRecorder.js" defer></script>
    <script src="../js/sensorControl.js" defer></script>
</head>
<body>
    <header>
        <h1>Arduino Sensor Dashboard</h1>
    </header>
    <main>
        <section id="sensor-status">
            <h2>Sensor Status</h2>
            <div id="status-display">
                <!-- Sensor status will be displayed here -->
            </div>
            <label for="active-time">Set Sensor Active Time:</label>
            <input type="number" id="active-time" min="1" max="1440" placeholder="Minutes (1-1440)">
            <button id="set-active-time">Set Active Time</button>
        </section>
        <section id="video-recording">
            <h2>Video Recording</h2>
            <video id="video-preview" autoplay></video>
            <button id="start-recording">Start Recording</button>
            <button id="stop-recording" disabled>Stop Recording</button>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Arduino Web App</p>
    </footer>
</body>
</html>
